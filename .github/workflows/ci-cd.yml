name: Calculator CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  JAVA_VERSION: 17
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - run: mvn -B -DskipTests=true validate

  build_test:
    runs-on: ubuntu-latest

    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - run: mvn -B test

      - run: mvn -B package

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/**

  dockerfile_lint:
    runs-on: ubuntu-latest

    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker_publish_staging:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    needs:
      - build_test
      - dockerfile_lint

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: target

      - run: cp target/*.jar app.jar

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - run: |
          docker build \
          -t $REGISTRY/$IMAGE_NAME:staging \
          -t $REGISTRY/$IMAGE_NAME:sha-$SHORT_SHA .

      - run: |
          docker push $REGISTRY/$IMAGE_NAME:staging
          docker push $REGISTRY/$IMAGE_NAME:sha-$SHORT_SHA